<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buy or rent pre-loved Indian fashion: wedding, party, ethnic and designer wear. Every listing is checked by the ReWear team." />
    <meta property="og:title" content="ReWear: buy and rent pre-loved Indian fashion" />
    <meta property="og:description" content="Wedding, party, ethnic and designer wear from real wardrobes. Rent it for your dates or buy it to keep." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReWear" />
    <meta property="og:url" content="%SITE_URL%/" />
    <!-- Link-preview card (client/public/og-image.png). Apps read these before any JavaScript runs -->
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReWear: Wear it again. Pre-loved Indian fashion to buy or rent." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Matches the dark header (Ink) so the phone status bar blends in -->
    <meta name="theme-color" content="#2b1d14" />

    <!-- Same mark as the navbar logo (src/components/ui/Logo.jsx) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Connect to the font and image hosts early so the first paint isn't delayed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@500;600;700;800&display=swap" rel="stylesheet">

    <title>ReWear: buy and rent pre-loved Indian fashion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
